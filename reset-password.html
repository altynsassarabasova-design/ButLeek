<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10384d">
    <title>Новый пароль — But|Leek</title>
    <link rel="icon" href="iconb.jpeg">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <main class="auth-layout">
        <section class="auth-aside">
            <a class="brand" href="index.html"><img class="brand-mark" src="iconb.jpeg" alt="">But|Leek</a>
            <h1>Вернитесь<br>к своим находкам.</h1>
            <div class="auth-aside-footer">Библиотека инструментов для разработчиков</div>
        </section>
        <section class="auth-content">
            <a class="back-link" href="index.html">Ко входу</a>
            <div class="auth-form-wrap">
                <h2>Новый пароль</h2>
                <p>Введите и подтвердите новый пароль. Используйте свежую ссылку из письма.</p>
                <form class="form-stack" data-auth="reset-password">
                    <label class="field">
                        <span>Новый пароль</span>
                        <input type="password" name="password" placeholder="Не менее 8 символов" minlength="8" autocomplete="new-password" required>
                    </label>
                    <label class="field">
                        <span>Повторите пароль</span>
                        <input type="password" name="confirmPassword" placeholder="Введите пароль ещё раз" minlength="8" autocomplete="new-password" required>
                    </label>
                    <button class="button button-primary" type="submit">Сохранить пароль</button>
                    <a class="auth-switch reset-login-link" href="index.html" hidden>Вернуться ко входу</a>
                    <p class="auth-switch">Ссылка устарела? <a href="forgot-password.html">Запросить новую</a></p>
                </form>
            </div>
        </section>
    </main>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
