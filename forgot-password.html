<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10384d">
    <title>Восстановление пароля — But|Leek</title>
    <link rel="icon" href="iconb.jpeg">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <main class="auth-layout">
        <section class="auth-aside" aria-label="О But|Leek">
            <a class="brand" href="main.html" draggable="false"><img class="brand-mark" src="iconb.jpeg" alt="" draggable="false">But|Leek</a>
            <img class="auth-background-logo" src="logoB.jpeg" alt="" aria-hidden="true" draggable="false">
            <h1>Вернём доступ<br>к вашим находкам.</h1>
            <div class="auth-aside-footer">Ссылка для восстановления придёт на вашу почту</div>
        </section>
        <section class="auth-content">
            <a class="back-link" href="index.html">Ко входу</a>
            <div class="auth-form-wrap">
                <h2>Забыли пароль?</h2>
                <p>Укажите почту аккаунта — отправим ссылку для создания нового пароля.</p>
                <form class="form-stack" data-auth="forgot-password">
                    <label class="field">
                        <span>Электронная почта</span>
                        <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </label>
                    <button class="button button-primary" type="submit">Отправить ссылку</button>
                    <p class="auth-switch"><a href="index.html">Вернуться ко входу</a></p>
                </form>
            </div>
        </section>
    </main>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
